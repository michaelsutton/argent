[workspace]
members = [".", "crates/argent-artifact", "crates/argent-runtime"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "ISC"
authors = ["Argent-lang developers"]
repository = "https://github.com/argent-lang/argent"

[workspace.dependencies]
argent-artifact = { path = "crates/argent-artifact" }
argent-runtime = { path = "crates/argent-runtime" }
blake2b_simd = "1.0.2"
blake3 = "1.8.5"
colored = "2.2.0"
faster-hex = "0.10"
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "a41a333b08848f41bf737b72592e463a6011b8ac" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "a41a333b08848f41bf737b72592e463a6011b8ac" }
kaspa-txscript-errors = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "a41a333b08848f41bf737b72592e463a6011b8ac" }
secp256k1 = { version = "0.29.0", features = ["global-context"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
silverscript-abi = { git = "https://github.com/kaspanet/silverscript", rev = "158534d606e9d5541e932c7575ff331e12699fb5", package = "silverscript-abi" }
silverscript-lang = { git = "https://github.com/kaspanet/silverscript", rev = "158534d606e9d5541e932c7575ff331e12699fb5", package = "silverscript-lang" }
thiserror = "2"

[package]
name = "argent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "argent"
path = "src/lib.rs"

[[bin]]
name = "argentc"
path = "src/main.rs"

[dependencies]
argent-artifact = { workspace = true }
argent-runtime = { workspace = true }
blake2b_simd = { workspace = true }
colored = { workspace = true }
kaspa-consensus-core = { workspace = true }
kaspa-txscript = { workspace = true }
serde_json = { workspace = true }
silverscript-abi = { workspace = true }
silverscript-lang = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
blake3 = { workspace = true }
kaspa-txscript-errors = { workspace = true }
secp256k1 = { workspace = true }
